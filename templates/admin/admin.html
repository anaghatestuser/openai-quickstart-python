{% extends "base.html" %}

{% block title %}
K.I.S.S. IELTS A.I. Assistant - Admin Panel 
{% endblock %}

{% block content %}   
<div class="container p-3">
    <h1>Admin Control Panel</h1>
    
    <h2>User Management</h2>
    <form action="/admin/adjust_user" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="tokens" class="form-label">Adjust Tokens:</label>
            <input type="number" class="form-control" id="tokens" name="tokens">
        </div>
        <div class="mb-3">
            <label for="days" class="form-label">Adjust Expiry Date (Days):</label>
            <input type="number" class="form-control" id="days" name="days">
        </div>
        <button type="submit" class="btn btn-primary">Adjust User</button>
    </form>
    <br>
    <a href="{{ url_for('view_users') }}" class="btn btn-primary">View All Users</a>
    <br><br>
    <a href="{{ url_for('view_logs') }}" class="btn btn-primary">View Logs</a>
    </div>
</div>
{% endblock %}
