<!-- form.html -->
<!DOCTYPE html>
<html>
<head>
    <title>K.I.S.S. IELTS A.I. Assistant</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css">
    <style>
        h2 {
            font-weight: bold;
            font-size: 20px;
        }
        p {
            font-family: var(--bs-body-font-family);
            font-size: var(--bs-body-font-size);
        }
        .btn-variation {
            display: inline-block;
            outline: none;
            cursor: pointer;
            font-size: var(--bs-body-font-size);
            line-height: 1;
            border-radius: 500px;
            transition-property: background-color,border-color,color,box-shadow,filter;
            transition-duration: .3s;
            border: 1px solid transparent;
            letter-spacing: 2px;
            min-width: 160px;
            text-transform: uppercase;
            white-space: normal;
            font-weight: 700;
            text-align: center;
            padding: 10px 20px;
            color: #fff;
            background-color: #1ED760;
            height: 40px;
        }
        .btn-variation:hover {
            transform: scale(1.04);
            background-color: #21e065;
        }
    </style>
</head>
<body>
    <div class="container p-3">
        <h1>K.I.S.S. IELTS A.I. Assistant</h1>
        
        {% if feedback_message %}
        <p>{{ feedback_message }}</p>
        {% endif %}
        
        <div class="mb-3">
            <form method="post" action="/generate">
                <label for="question" class="form-label"><strong>Enter your question:</strong></label>
                <textarea class="form-control" type="textarea" id="question" name="question" rows="4"></textarea><br>
                <input type="submit" value="Submit" class="btn-variation">
            </form>
        </div>

        <div class="mb-3">
            <h2>Sample Question and Answers:</h2>
            <br>
            <ul>
                <li><b>Question:</b> {{ question }}</li>
                <br>
                <li><b>Supportive Answer:</b> {{ supportive_answer }}</li>
                <br>
                <li><b>Opposing Answer:</b> {{ opposing_answer }}</li>
            </ul>
        </div>
    </div>
</body>
</html>
